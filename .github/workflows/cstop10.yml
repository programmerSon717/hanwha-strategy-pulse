name: bsp-pulse-cs-top10

# 📌 A팀 Top10 — 매일 KST 06:50.
#
# ☀️ Morning Brief(07:00, brief.yml)와 **선정 기준이 다르다.**
#   Morning Brief : 모델의 strategic_score + 추천 서칭 순서 티어
#   A팀 Top10  : csfit.score() — A팀이 실제 공유한 125건의 주제 분포
#
# GitHub 의 cron 은 UTC 다. KST 06:50 = UTC 21:50 (전날).
#
# **예약 실행은 정시에 오지 않는다.** GitHub 무료 티어의 schedule 은 best-effort 라
# 몇 분에서 수십 분까지 밀린다(크립토 봇 실측: 간격 중앙값 42분, 최대 11시간).
# 브리프는 "아침 7시 전후"면 되는 물건이라 이 지연을 감수한다.
# 정시성이 꼭 필요해지면 21:40 UTC 에 한 번 더 걸고 중복 발행을 digest_log 로 막는다
# (store.last_brief_cutoff 가 이미 그 역할을 한다).

on:
  schedule:
    # **06:50 은 무슨 일이 있어도 나가야 한다**(2026-10-05 사용자 지정).
    #
    # 그래서 깨우는 길을 셋으로 둔다. 어느 하나만 와도 나가고, 둘 이상이 와도
    # --if-due 가 "오늘 이미 발행함"을 보고 한 번만 내보낸다.
    #   1) 상시 루프(bot.yml)가 06:50 정각에 깨어나 바로 낸다  ← 주 경로
    #   2) 아래 cron 3개 — 루프가 죽어 있을 때의 보험
    #   3) 사람이 Actions 에서 Run workflow
    #
    # cron 을 여러 개 거는 이유: GitHub 무료 티어 예약은 best-effort 라 하루
    # 한 번짜리는 통째로 건너뛴다(2026-10-02 실측: 발화 0건). 세 번 걸면
    # 전부 빠질 확률이 그만큼 낮아진다. KST 06:50 = UTC 21:50 (전날).
    # 06:45 로 두면 due() 가 "아직 06:50 전" 으로 무조건 거부한다 — 삼중 보험
    # 중 하나가 가짜였다(2026-10-05 감사). 발행 시각 직후로 당긴다.
    - cron: "51 21 * * *"
    - cron: "52 21 * * *"
    - cron: "5 22 * * *"
    # 초안 생성·게시 백업. 상시 루프가 죽어 있어도 초안은 올라간다.
    # 초안은 📌 Top10 과 🔗 링크용 탭에 **실제로 게시**되고, 더 나은 초안이
    # 나오면 앞서 올린 것을 지우고 교체한다(2026-10-05 발주자 지정).
    #
    # 상시 회차 — 지정 시각 12분 전에 시작해 **그 시각에는 이미 끝나 있게** 한다.
    # KST 11:48·17:48·21:48·03:48 = UTC 02:48·08:48·12:48·18:48.
    - cron: "48 2 * * *"
    - cron: "48 8 * * *"
    - cron: "48 12 * * *"
    - cron: "48 18 * * *"
    # 2026-10-05 저녁의 임시 회차(그날 18:00 을 놓쳐 시간마다 갈아끼운다).
    # KST 19:15·20·21·23 = UTC 10:15·11:00·12:00·14:00.
    # 날짜가 지나면 draft_due 가 알아서 무시한다 — cron 만 남아도 무해하다.
    - cron: "3 10 * * *"
    - cron: "48 10 * * *"
    - cron: "48 11 * * *"
    - cron: "48 13 * * *"
    # KST 00:00·01:00·03:00 = UTC 15:00·16:00·18:00.
    - cron: "48 14 * * *"
    - cron: "48 15 * * *"
    - cron: "48 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "발행하지 않고 내용만 확인"
        type: boolean
        default: true

# 상태 DB 를 커밋해야 같은 기사를 다시 발행하지 않는다.
permissions:
  contents: write

concurrency:
  # brief.yml 과 같은 그룹을 쓰면 07:00 브리프와 07:05 Top10 이 서로를 밀어낸다
  # (GitHub 은 그룹당 대기열 1개). 백업끼리 취소하면 보험이 아니다.
  #
  # **run_id 를 섞어 회차마다 그룹을 가른다.** 같은 그룹이면 06:51 백업이
  # 대기 중일 때 06:52 백업이 들어와 앞의 것을 취소한다 — 삼중 보험이
  # 사실상 일중 보험으로 무너진다(2026-10-05 감사). 가르면 셋이 각자
  # 돌고, --if-due 가 "오늘 이미 발행함"을 보고 한 번만 내보낸다.
  group: bsp-pulse-top10-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Morning Brief 생성
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # telegra.ph IV 페이지용. 비어도 돌지만 실행마다 계정이 새로 생긴다.
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
          USE_TOPICS: "true"
          TG_TOPIC_HANWHA_GROUP: ${{ secrets.TG_TOPIC_HANWHA_GROUP }}
          TG_TOPIC_MA_GOVERNANCE: ${{ secrets.TG_TOPIC_MA_GOVERNANCE }}
          TG_TOPIC_INSURANCE_FINANCE: ${{ secrets.TG_TOPIC_INSURANCE_FINANCE }}
          TG_TOPIC_REGULATION_POLICY: ${{ secrets.TG_TOPIC_REGULATION_POLICY }}
          TG_TOPIC_COMPETITORS_BIGTECH: ${{ secrets.TG_TOPIC_COMPETITORS_BIGTECH }}
          TG_TOPIC_DIGITAL_NEWBIZ: ${{ secrets.TG_TOPIC_DIGITAL_NEWBIZ }}
          TG_TOPIC_GLOBAL_FINANCE: ${{ secrets.TG_TOPIC_GLOBAL_FINANCE }}
          TG_TOPIC_KEY_ISSUES: ${{ secrets.TG_TOPIC_KEY_ISSUES }}
          TG_TOPIC_DAILY_BRIEF: ${{ secrets.TG_TOPIC_DAILY_BRIEF }}
          TG_TOPIC_CS_TOP10: ${{ secrets.TG_TOPIC_CS_TOP10 }}
          TG_TOPIC_CS_TOP10_LINKS: ${{ secrets.TG_TOPIC_CS_TOP10_LINKS }}
          # 수동 실행에서 dry_run 을 켜면 발행하지 않는다.
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        # --if-due: 06:50 전에 깨면 아무것도 하지 않고 빠진다. 지난 뒤에
        # 깨고 오늘 아직 안 나갔을 때만 낸다. 중복 발행이 원천 차단된다.
        #
        # 초안도 같은 단계에서 돌린다. **이게 없으면 초안 백업 cron 이
        # 가짜다** — 16·18·22·04시에 깨어나 발행만 시도하고, --if-due 가
        # "06:50 아님" 으로 즉시 빠져 아무것도 안 했다(2026-10-05 발견).
        # 주석은 "상시 루프가 죽어 있어도 다음날 발행분은 준비된다"고
        # 적혀 있었지만 실제로는 준비되지 않았다.
        # 둘 다 --if-due 라 제 시각이 아니면 비용 없이 빠진다.
        run: |
          python main.py --cstop10 --if-due
          python main.py --cstop10-draft --if-due

      - name: 브리프 기록 저장
        # **always() 가 필요하다.** 앞 단계가 타임아웃으로 죽으면 발행은
        # 됐는데 기록 커밋이 안 돼, 다음 cron 이 또 발행한다(2026-10-05 감사).
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "bsp-pulse-bot"
          git config user.email "bsp-pulse@users.noreply.github.com"
          git add botstate.sqlite3 || true
          git diff --cached --quiet || git commit -m "chore: Morning Brief 기록 [skip ci]"
          # **rebase 대신 SQL 병합.** 바이너리 DB 는 git 이 못 합쳐서
          # rebase 가 반드시 충돌하고, abort 하면 그 회차 기록이
          # 통째로 사라진다(2026-10-05 실측: 2시간 유실).
          git fetch -q origin || true
          python tools/merge_state.py origin/main || true
          git add botstate.sqlite3 || true
          git commit -q --amend --no-edit || true
          git push || echo "[경고] push 실패 — 다음 실행에서 다시 시도"
