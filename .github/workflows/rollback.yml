name: rollback

# 어드민 페이지의 되돌리기 버튼이 부르는 워크플로.
#
# 하는 일은 셋이다.
#   1. 지금 도는 봇 루프를 취소한다 (안 그러면 옛 코드가 5시간 30분 더 돈다)
#   2. 작업트리를 지정한 커밋과 똑같이 만든다 — 단, 아래 '지킬 것'은 빼고
#   3. 그 상태를 main 에 커밋·푸시한다 → push 트리거로 봇이 새로 뜬다
#
# **되돌리는 것은 봇 로직뿐이다.** 다음은 절대 되돌리지 않는다.
#   botstate.sqlite3  되돌리면 이미 발행한 뉴스를 처음부터 다시 발행한다
#   topics.json       탭 thread_id 캐시. 되돌리면 텔레그램에 탭이 중복 생성된다
#   docs/, admin/     상태판과 도구. 되돌리면 이 되돌리기 버튼 자체가 사라져
#                     앞으로 감기가 불가능해진다
#   HANDOFF.md, RULES.md   문서. 되돌린다고 좋아질 게 없다
#   이 파일            자신을 지우면 다시는 못 부른다
#
# 되돌린 결과도 그냥 main 위의 새 커밋이다. 이력이 앞으로만 흐르므로
# 되돌린 뒤 다시 최신으로 돌아오는 것도 같은 버튼으로 된다.

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "되돌릴 커밋 (전체 SHA)"
        required: true
      label:
        description: "그 버전의 설명 (기록용)"
        required: false
        default: ""

# 봇 루프와 다른 그룹을 써야 한다. 같은 그룹이면 5시간 30분짜리 루프 뒤에
# 줄을 서서, 정작 급할 때 몇 시간을 기다리게 된다.
concurrency:
  group: rollback
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 기본 GITHUB_TOKEN 으로 푸시하면 다른 워크플로가 발화하지 않는다.
          # 되돌린 뒤 봇이 자동으로 떠야 하므로 PAT 으로 푸시한다.
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: 대상 커밋 확인
        id: check
        env:
          TARGET: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${TARGET}^{commit}" 2>/dev/null; then
            echo "::error::그런 커밋이 없다: ${TARGET}"
            exit 1
          fi
          # main 에 속한 커밋만 허용한다. 아무 SHA 나 받으면 어드민 페이지를
          # 아는 사람이 임의의 코드를 배포할 수 있다.
          if ! git merge-base --is-ancestor "$TARGET" origin/main; then
            echo "::error::main 이력에 없는 커밋이다: ${TARGET}"
            exit 1
          fi
          echo "subject=$(git log -1 --format=%s "$TARGET")" >> "$GITHUB_OUTPUT"
          echo "when=$(TZ=Asia/Seoul git log -1 --format=%cd --date=format:'%m-%d %H:%M' "$TARGET")" >> "$GITHUB_OUTPUT"

      - name: 도는 봇 루프 취소
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IDS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/bot.yml/runs?per_page=20" \
                 --jq '.workflow_runs[] | select(.status=="in_progress" or .status=="queued") | .id')
          if [[ -z "$IDS" ]]; then
            echo "도는 실행 없음"
          else
            for id in $IDS; do
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null 2>&1 \
                && echo "취소 요청: run ${id}" || echo "취소 실패(이미 끝났을 수 있다): run ${id}"
            done
          fi

      - name: 코드만 대상 버전으로 되돌리기
        id: revert
        env:
          TARGET: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          CUR=$(git rev-parse HEAD)

          # 작업트리를 대상 커밋과 완전히 동일하게 만든다.
          # (그 뒤에 없던 파일은 지워지고, 지웠던 파일은 되살아난다)
          git read-tree -u --reset "$TARGET"

          # 상태·도구·문서는 현재 것을 다시 덮어써 되돌아가지 않게 한다.
          for p in botstate.sqlite3 topics.json docs admin HANDOFF.md RULES.md .github/workflows/rollback.yml; do
            git checkout "$CUR" -- "$p" 2>/dev/null || true
          done

          if git diff --cached --quiet && git diff --quiet; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "이미 그 버전이다 — 코드 변경 없음"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
            git diff --cached --stat | tail -20
          fi

      - name: 커밋·푸시
        if: steps.revert.outputs.changed == '1'
        env:
          TARGET: ${{ inputs.target_sha }}
          SUBJ: ${{ steps.check.outputs.subject }}
          WHEN: ${{ steps.check.outputs.when }}
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          SHORT=${TARGET:0:7}
          # 커밋 메시지는 파일로 넘긴다. run 블록 안에서 heredoc 본문을 쓰면
          # 그 줄들이 열 0 에서 시작해 YAML 자체가 깨진다.
          # 그리고 메시지에 건너뛰기 표시를 넣으면 안 된다 — 봇이 새로 떠야 한다.
          {
            echo "revert: ${WHEN} 버전(${SHORT})으로 되돌림"
            echo ""
            echo "되돌린 대상: ${SUBJ}"
            echo "요청 메모: ${LABEL:-(없음)}"
            echo ""
            echo "봇 로직만 되돌렸다. 발행 이력 DB·탭 캐시·상태판·문서는 그대로 둔다."
          } > /tmp/rollback-msg.txt
          git commit -F /tmp/rollback-msg.txt

          # 루프가 취소되며 상태를 커밋했을 수 있다. 몇 번 다시 시도한다.
          for i in 1 2 3 4 5; do
            if git push origin main; then echo "푸시 완료"; exit 0; fi
            echo "푸시 거절 — 원격을 다시 받아 재시도 ($i/5)"
            git fetch origin main
            # 코드는 내 것이 맞고, DB 는 루프가 방금 저장한 원격 것이 최신이다.
            if ! git rebase origin/main -X theirs; then
              git rebase --abort || true
              sleep 5
              continue
            fi
            sleep 3
          done
          echo "::error::푸시 실패"
          exit 1

      - name: 변경이 없으면 봇만 다시 띄우기
        if: steps.revert.outputs.changed == '0'
        env:
          PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -euo pipefail
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PAT}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/bot.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "봇 재시작 요청 완료"

      - name: 결과
        run: |
          echo "### 되돌리기 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 대상: \`${{ inputs.target_sha }}\` — ${{ steps.check.outputs.subject }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 코드 변경: ${{ steps.revert.outputs.changed == '1' && '있음 (푸시함)' || '없음 (봇만 재시작)' }}" >> "$GITHUB_STEP_SUMMARY"
