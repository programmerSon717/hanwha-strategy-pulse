<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CryptoNews 봇 인수인계</title>
<meta name="build" content="v3">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🛰</text></svg>">
<style>
:root{--paper:#FBFAF7;--surface:#FFFFFF;--sunk:#F3F1EC;--ink:#14161C;--ink-2:#4A4F5C;--ink-3:#7C818E;
 --rule:#E3E0D8;--rule-2:#CFCBC0;--patina:#2F7A6F;--warn-bg:#F7EFDD;--warn:#9A6A0C;
 --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F1218;--surface:#171B23;--sunk:#12161D;
 --ink:#E8EAF0;--ink-2:#A7AEBD;--ink-3:#767E8F;--rule:#262C38;--rule-2:#333B4A;--patina:#5FB3A4;
 --warn-bg:#2A2113;--warn:#D2A03F}}
:root[data-theme="dark"]{--paper:#0F1218;--surface:#171B23;--sunk:#12161D;--ink:#E8EAF0;--ink-2:#A7AEBD;
 --ink-3:#767E8F;--rule:#262C38;--rule-2:#333B4A;--patina:#5FB3A4;--warn-bg:#2A2113;--warn:#D2A03F}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:24px 20px 72px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{margin:0;font-weight:640;text-wrap:balance}
a{color:var(--patina)}
nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
nav a{padding:5px 10px;border:1px solid var(--rule);border-radius:2px;text-decoration:none;color:var(--ink-2)}
nav a[aria-current]{border-color:var(--patina);color:var(--patina)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.roles{display:flex;flex-wrap:wrap;gap:6px}
.roles button{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--rule-2);border-radius:2px;
  background:var(--surface);color:var(--ink-2);cursor:pointer}
.roles button[aria-pressed=true]{border-color:var(--patina);color:var(--patina);background:var(--surface)}
input[type=search]{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--rule-2);border-radius:2px;
  background:var(--surface);color:var(--ink);width:100%;max-width:340px}
:focus-visible{outline:2px solid var(--patina);outline-offset:2px}
.role{display:flex;flex-direction:column;gap:12px}
.role>h2{font-size:15px;display:flex;align-items:baseline;gap:10px}
.role>h2 small{font-weight:400;color:var(--ink-3);font-size:12.5px}
details{border:1px solid var(--rule);border-radius:3px;background:var(--surface);overflow:hidden}
summary{cursor:pointer;padding:11px 14px;font-weight:560;font-size:14px;display:flex;gap:10px;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--ink-3);font-size:12px}
details[open] summary::before{content:"▾"}
summary .src{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.body{padding:2px 16px 14px 30px;border-top:1px solid var(--rule);font-size:14px;color:var(--ink-2)}
.body p{margin:.6em 0}
.body ul{margin:.5em 0;padding-left:1.1em}
.body li{margin:.28em 0}
.body code{font-family:var(--mono);font-size:12.5px;background:var(--sunk);padding:1px 4px;border-radius:2px}
.body pre{background:var(--sunk);border:1px solid var(--rule);border-radius:2px;padding:11px 12px;overflow-x:auto;
  font-family:var(--mono);font-size:12px;line-height:1.55}
.body table{width:100%;border-collapse:collapse;font-size:13px;margin:.6em 0;display:block;overflow-x:auto}
.body th,.body td{border-bottom:1px solid var(--rule);padding:6px 10px 6px 0;text-align:left;vertical-align:top}
.body blockquote{margin:.6em 0;padding:9px 13px;background:var(--warn-bg);border-left:3px solid var(--warn);
  color:var(--ink-2);border-radius:0 2px 2px 0}
.body strong{color:var(--ink)}
footer{border-top:1px solid var(--rule);padding-top:16px;color:var(--ink-3);font-size:12.5px}
mark{background:var(--warn-bg);color:var(--ink)}
.toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{border:1px solid var(--rule);border-radius:3px;background:var(--surface);padding:14px 16px;
  display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:13.5px;display:flex;align-items:baseline;gap:8px}
.card h3 b{font-family:var(--mono);font-size:11px;color:var(--patina);font-weight:600}
.card p{margin:0;color:var(--ink-3);font-size:12.5px;line-height:1.45}
.card ol{margin:0;padding-left:1.1em;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.card ol a{color:inherit;text-decoration:none}
.card ol a:hover{color:var(--patina);text-decoration:underline}
.card.hot{border-color:var(--patina)}
.sec-anchor{scroll-margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="./">상태</a>
    <a href="./handoff.html" aria-current="page">인수인계</a>
  </nav>
  <div>
    <div class="eyebrow">CryptoNews 봇</div>
    <h1 style="font-size:24px;margin-top:4px">인수인계 문서</h1>
    <p style="color:var(--ink-3);font-size:13.5px;margin:.4em 0 0">
      찾는 목적별로 갈라놨다. 코드를 고치기 전에는 <b>절대 규칙</b>부터 본다.</p>
  </div>
  <section>
    <div class="eyebrow" style="margin-bottom:10px">무엇이 어디에 있나</div>
    <div class="toc" id="toc"></div>
  </section>
  <div class="roles" id="roles"></div>
  <input type="search" id="q" placeholder="문서 전체 검색">
  <div id="out"></div>
  <footer id="foot"></footer>
</div>
<script>
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n;};
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

/* 아주 작은 마크다운 렌더러 — 이 문서가 쓰는 문법만 다룬다.
   **모든 분기는 반드시 i 를 전진시킨다.** 예전 판은 백틱으로 시작하는 줄
   (`국내정책` · `US Policy` …)에서 아무 분기도 소비하지 못해 무한 루프에 빠졌고,
   페이지가 통째로 멎었다. 그래서 마지막에 안전장치까지 둔다. */
function md(src){
  const lines=src.split('\n'); const out=[]; let i=0; let guard=0;
  const inline=t=>esc(t)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const isList=l=>/^\s*([-*]|\d+\.)\s+/.test(l);
  while(i<lines.length){
    if(++guard>20000) break;                 // 어떤 경우에도 멈춘다
    const l=lines[i];
    if(!l.trim()){i++;continue;}
    if(/^```/.test(l)){
      const buf=[];i++;
      while(i<lines.length&&!/^```/.test(lines[i]))buf.push(lines[i++]);
      i++;                                    // 닫는 펜스
      out.push(`<pre>${esc(buf.join('\n'))}</pre>`);continue;
    }
    if(/^\s*\|/.test(l)){
      const buf=[];
      while(i<lines.length&&/^\s*\|/.test(lines[i]))buf.push(lines[i++]);
      const rows=buf.filter(r=>!/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push('<table>'+rows.map((r,ri)=>{
        const c=r.trim().replace(/^\||\|$/g,'').split('|');
        const tag=ri?'td':'th';
        return '<tr>'+c.map(x=>`<${tag}>${inline(x.trim())}</${tag}>`).join('')+'</tr>';
      }).join('')+'</table>');continue;
    }
    if(/^\s*>/.test(l)){
      const buf=[];
      while(i<lines.length&&/^\s*>/.test(lines[i]))buf.push(lines[i++].replace(/^\s*>\s?/,''));
      out.push(`<blockquote>${inline(buf.join(' '))}</blockquote>`);continue;
    }
    if(isList(l)){
      const items=[];
      while(i<lines.length&&(isList(lines[i])||(/^\s{2,}\S/.test(lines[i])&&items.length))){
        const m=lines[i].match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
        if(m)items.push(m[1]); else items[items.length-1]+=' '+lines[i].trim();
        i++;
      }
      out.push('<ul>'+items.map(x=>`<li>${inline(x)}</li>`).join('')+'</ul>');continue;
    }
    // 그 밖은 문단. **여기서 반드시 최소 한 줄은 소비한다.**
    const buf=[lines[i++]];
    while(i<lines.length&&lines[i].trim()&&!/^```/.test(lines[i])&&!/^\s*[|>]/.test(lines[i])&&!isList(lines[i]))
      buf.push(lines[i++]);
    out.push(`<p>${inline(buf.join(' '))}</p>`);
  }
  return out.join('');
}

let DATA=null,active=null;
const slug=s=>'s-'+s.replace(/[^0-9A-Za-z가-힣]+/g,'-').replace(/^-|-$/g,'').toLowerCase();

function buildToc(){
  const toc=$('#toc');toc.replaceChildren();
  DATA.roles.forEach(r=>{
    const c=el('div','card'+(r.name==='절대 규칙'?' hot':''));
    const h=el('h3',null,r.name);h.append(el('b',null,String(r.sections.length)));
    c.append(h);
    if(r.hint)c.append(el('p',null,r.hint));
    const ol=el('ol');
    r.sections.forEach(sec=>{
      const li=el('li');const a=el('a',null,sec.title);
      a.href='#'+slug(sec.title);
      a.onclick=()=>{active=null;$('#q').value='';draw();
        setTimeout(()=>{const t=document.getElementById(slug(sec.title));
          if(t){t.open=true;t.scrollIntoView({behavior:'smooth',block:'start'});}},30);};
      li.append(a);ol.append(li);
    });
    c.append(ol);toc.append(c);
  });
}

function draw(){
  const q=$('#q').value.trim().toLowerCase();
  const out=$('#out');out.replaceChildren();
  let shown=0;
  DATA.roles.forEach(r=>{
    if(active&&r.name!==active)return;
    const secs=r.sections.filter(s=>!q||(s.title+s.body).toLowerCase().includes(q));
    if(!secs.length)return;
    const box=el('section','role');
    const h=el('h2',null,r.name);h.append(el('small',null,r.hint||''));box.append(h);
    secs.forEach(s=>{
      const d=el('details','sec-anchor');d.id=slug(s.title);
      const sm=el('summary',null,s.title);sm.append(el('span','src',s.source));
      const bd=el('div','body');
      // 본문은 **펼칠 때** 만든다. 32개를 미리 다 그리면 첫 화면이 그만큼 늦다.
      const fill=()=>{if(!bd.dataset.done){bd.innerHTML=md(s.body);bd.dataset.done='1';}};
      d.addEventListener('toggle',()=>{if(d.open)fill();});
      if(q){d.open=true;fill();}
      d.append(sm,bd);box.append(d);shown++;
    });
    out.append(box);
  });
  if(!shown)out.append(el('p','eyebrow','해당하는 항목이 없다.'));
  $('#foot').textContent=`${shown}개 항목 · HANDOFF.md 와 RULES.md 에서 자동 생성 · 화면 v3`;
}

fetch('handoff.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  DATA=d;
  const rb=$('#roles');
  const mk=(name,label)=>{const b=el('button',null,label);b.setAttribute('aria-pressed',String(active===name));
    b.onclick=()=>{active=active===name?null:name;[...rb.children].forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.n===active)));draw();};
    b.dataset.n=name===null?'':name;return b;};
  const all=mk(null,'전체');all.dataset.n='';rb.append(all);
  d.roles.forEach(r=>{const b=mk(r.name,`${r.name} ${r.sections.length}`);rb.append(b);});
  $('#q').oninput=draw;
  buildToc();
  draw();
}).catch(e=>{$('#out').innerHTML='<p class="eyebrow">문서를 못 읽었다. 봇이 아직 갱신하지 않았을 수 있다.</p>';});
</script>
</body>
</html>
